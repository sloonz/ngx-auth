global
    maxconn 1024

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend websites
    bind 127.0.0.1:8080
    filter spoe engine ngx-auth config examples/ngx-auth.spoe

    # The browser login and OIDC callback endpoints must be publicly reachable.
    acl auth_service hdr(host),field(1,:) -i auth.example.com
    http-request set-var-fmt(txn.ngx_auth_url) %[ssl_fc,iif(https,http)]://%[req.hdr(host)]%[pathq] unless auth_service
    http-request send-spoe-group ngx-auth auth unless auth_service

    # Missing results, agent timeouts and internal errors all deny access.
    http-request return status 503 if !auth_service !{ var(txn.ngx_auth.status) -m found }
    http-request return status 302 hdr Location %[var(txn.ngx_auth.location)] hdr Set-Cookie %[var(txn.ngx_auth.set_cookie)] if !auth_service { var(txn.ngx_auth.status) -m int 401 }
    http-request deny deny_status 403 if !auth_service { var(txn.ngx_auth.status) -m int 403 }
    http-request return status 503 if !auth_service !{ var(txn.ngx_auth.status) -m int 200 }

    use_backend auth_http if auth_service
    default_backend application

backend auth_http
    server ngx-auth 127.0.0.1:47814

backend application
    server app 127.0.0.1:8000

backend auth_agent
    mode tcp
    option spop-check
    server ngx-auth 127.0.0.1:12345 check
