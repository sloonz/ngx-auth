[package]
name = "ngx-auth"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
license = "Unlicense"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
josekit = "0.10"
maud = { version = "0.27", features = ["axum"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "mysql", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
